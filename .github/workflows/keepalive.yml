# Keeps the free demo awake: Render free services sleep after 15 min without
# visitors (and lose their cache). Set the repository variable SPACE_URL (Settings > Secrets and
# variables > Actions > Variables), e.g. https://openatlas-dvb8.onrender.com
name: Keep the demo awake

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a little)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - name: Visit the site and the API
        run: |
          curl -fsS -o /dev/null -w "site %{http_code}\n" --retry 5 --retry-delay 30 "${{ vars.SPACE_URL }}/"
          curl -fsS -o /dev/null -w "api  %{http_code}\n" --retry 5 --retry-delay 30 "${{ vars.SPACE_URL }}/api/health"
