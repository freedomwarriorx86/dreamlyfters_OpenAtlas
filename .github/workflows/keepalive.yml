# Keeps the Hugging Face Space awake: free Spaces sleep after 48 h without
# visitors. Set the repository variable SPACE_URL (Settings > Secrets and
# variables > Actions > Variables), e.g. https://dreamlyfters-openatlas.hf.space
name: Keep the demo awake

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SPACE_URL != '' }}
    steps:
      - name: Visit the site and the API
        run: |
          curl -fsS -o /dev/null -w "site %{http_code}\n" --retry 5 --retry-delay 30 "${{ vars.SPACE_URL }}/"
          curl -fsS -o /dev/null -w "api  %{http_code}\n" --retry 5 --retry-delay 30 "${{ vars.SPACE_URL }}/api/health"
